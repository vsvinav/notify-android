[package]
name = "notify-channel"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
publish = false

[features]
default = ["macos-hardware"]
macos-hardware = []

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "notify-channel"
path = "src/bin/native.rs"
required-features = ["macos-hardware"]

[[test]]
name = "native"
required-features = ["macos-hardware"]

[dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = "=0.5.0"
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
